<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Tugas 3 Javascript</h1>
    <script type="text/javascript">
        let angka1 = 10;
        let angka2 = 5;
        // penjumlahan
        let hasil = angka1 + angka2
        document.write("Hasil penjumlahan: " + hasil + "<br>");
        // pengurangan
        let hasil2 = angka1 - angka2
        document.write("Hasil pengurangan: " + hasil2 + "<br>");
        // perkalian
        let hasil3 = angka1 * angka2
        document.write("Hasil perkalian: " + hasil3 + "<br>");
        // pembagian
        let hasil4 = angka1 / angka2
        document.write("Hasil pembagian: " + hasil4 + "<br>");
    </script>

</body>

</html>
