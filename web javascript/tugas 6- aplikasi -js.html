<<!DOCTYPE html>
    <html lang="id">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aplikasi Pendataan Barang Modern</title>
        <style>
            /* Gaya Tampilan (CSS) agar Aplikasi Terlihat Bagus */
            
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #f4f7f6;
                margin: 0;
                padding: 40px;
                display: flex;
                justify-content: center;
            }
            
            .container {
                width: 100%;
                max-width: 500px;
                background: #ffffff;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            }
            
            h2 {
                color: #333333;
                margin-top: 0;
                margin-bottom: 20px;
                font-size: 24px;
                text-align: center;
            }
            
            fieldset {
                border: 1px solid #e2e8f0;
                border-radius: 8px;
                padding: 20px;
                background-color: #f8fafc;
                margin-bottom: 25px;
            }
            
            legend {
                font-weight: 600;
                color: #4a5568;
                padding: 0 10px;
                font-size: 14px;
            }
            
            label {
                display: block;
                margin-bottom: 8px;
                color: #4a5568;
                font-size: 14px;
                font-weight: 500;
            }
            
            .input-group {
                display: flex;
                gap: 10px;
            }
            
            input[type="text"] {
                flex: 1;
                padding: 10px 14px;
                border: 1px solid #cbd5e1;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
                transition: border-color 0.2s;
            }
            
            input[type="text"]:focus {
                border-color: #3b82f6;
            }
            
            button {
                padding: 10px 20px;
                background-color: #3b82f6;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s;
            }
            
            button:hover {
                background-color: #2563eb;
            }
            /* Mengubah List biasa menjadi tampilan tabel yang rapi */
            
            ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            
            li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 16px;
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 6px;
                margin-bottom: 8px;
                font-size: 15px;
                color: #334155;
                transition: transform 0.2s;
            }
            
            li:hover {
                transform: translateY(-1px);
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            }
            
            .btn-delete {
                color: #ef4444;
                text-decoration: none;
                font-size: 13px;
                font-weight: 600;
                padding: 4px 8px;
                border-radius: 4px;
                transition: background-color 0.2s;
            }
            
            .btn-delete:hover {
                background-color: #fee2e2;
            }
        </style>
    </head>

    <body>

        <div class="container">
            <h2>Pendataan Barang</h2>

            <fieldset>
                <legend>Form Input</legend>
                <label for="nama">Nama Barang</label>
                <div class="input-group">
                    <input type="text" id="nama" placeholder="Ketik nama barang...">
                    <button onclick="AddData();">Simpan</button>
                </div>
            </fieldset>

            <!-- Tempat menampilkan daftar barang -->
            <ul id="list-barang"></ul>
        </div>

        <!-- Menghubungkan ke logika JavaScript Anda -->
        <script type="text/javascript" src="fungsi.js"></script>

    </body>

    </html>
