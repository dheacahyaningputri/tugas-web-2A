<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script type="text/javascript">
        // membuat array
        var buah = ["mangga", "apel", "jeruk", "pisang"];
        console.log(buah);
        var harga = [10000, 15000, 20000, 25000];
        console.log(harga[4]); // menampilkan data ke 4
        // menampilkan array dengan perulangan
        buah.forEach(function(data, index) {
            document.write("Buah ke- 4" + (index + 1) + " adalah " + data + "<br>");
        });
    </script>
</body>

</html>
